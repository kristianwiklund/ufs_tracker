name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Console executable
      run: |
        pyinstaller UFS-Tracker.spec
    
    - name: Build Desktop GUI executable
      run: |
        pyinstaller UFS-Tracker-Desktop.spec
    
    - name: Create portable package
      run: |
        mkdir UFS-Tracker-Windows
        
        rem Copy the Desktop app bundle
        xcopy /E /I dist\UFS-Tracker-Desktop UFS-Tracker-Windows\Desktop
        
        rem Copy the Console app bundle
        xcopy /E /I dist\UFS-Tracker UFS-Tracker-Windows\Console
        
        rem Copy docs
        copy README.md UFS-Tracker-Windows\
        copy USER_GUIDE.md UFS-Tracker-Windows\
        
        rem start.bat runs the Desktop (pywebview) app
        echo @echo off > UFS-Tracker-Windows\start.bat
        echo echo Starting UFS Maritime Notices Tracker... >> UFS-Tracker-Windows\start.bat
        echo Desktop\UFS-Tracker-Desktop.exe >> UFS-Tracker-Windows\start.bat
        
        rem start-console.bat runs the browser version
        echo @echo off > UFS-Tracker-Windows\start-console.bat
        echo echo Starting UFS Maritime Notices Tracker (Browser mode)... >> UFS-Tracker-Windows\start-console.bat
        echo start http://127.0.0.1:5000 >> UFS-Tracker-Windows\start-console.bat
        echo Console\UFS-Tracker.exe >> UFS-Tracker-Windows\start-console.bat
        
        echo UFS Maritime Notices Tracker - Windows Package > UFS-Tracker-Windows\README-PACKAGE.txt
        echo. >> UFS-Tracker-Windows\README-PACKAGE.txt
        echo Desktop App (Recommended): Double-click start.bat >> UFS-Tracker-Windows\README-PACKAGE.txt
        echo Browser Mode: Double-click start-console.bat >> UFS-Tracker-Windows\README-PACKAGE.txt
      shell: cmd
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UFS-Tracker-Windows
        path: UFS-Tracker-Windows/
    
    - name: Create ZIP archive for release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        powershell Compress-Archive -Path UFS-Tracker-Windows -DestinationPath UFS-Tracker-Windows.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: UFS-Tracker-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
